name: Node Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. node-v0.1.0-alpha.1)'
        required: true

# Default to the minimum at the workflow level (CodeQL: "Workflow does not
# contain permissions"). The publish job overrides with id-token: write
# for npm provenance.
permissions:
  contents: read

defaults:
  run:
    working-directory: node

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    permissions:
      id-token: write          # for npm provenance
      contents: read
    environment: npm-publish

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: node/package-lock.json
          registry-url: https://registry.npmjs.org

      - name: Set version from release tag
        if: github.event_name == 'release'
        run: |
          # release.tag_name format: node-v0.1.0-alpha.1 → 0.1.0-alpha.1
          TAG="${{ github.event.release.tag_name }}"
          VERSION="${TAG#node-v}"
          CURRENT="$(node -p "require('./package.json').version")"
          echo "Tag version: $VERSION"
          echo "package.json version: $CURRENT"
          if [ "$CURRENT" = "$VERSION" ]; then
            echo "Version already set in package.json — skipping bump."
          else
            npm version --no-git-tag-version "$VERSION"
          fi

      - name: Set version from manual input
        if: github.event_name == 'workflow_dispatch'
        run: |
          TAG="${{ inputs.tag }}"
          VERSION="${TAG#node-v}"
          CURRENT="$(node -p "require('./package.json').version")"
          echo "Input version: $VERSION"
          echo "package.json version: $CURRENT"
          if [ "$CURRENT" = "$VERSION" ]; then
            echo "Version already set in package.json — skipping bump."
          else
            npm version --no-git-tag-version "$VERSION"
          fi

      - name: Install
        run: npm ci || npm install

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      - name: Determine npm dist-tag
        id: tag
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          if [[ "$VERSION" == *-alpha* ]] || [[ "$VERSION" == *-beta* ]] || [[ "$VERSION" == *-rc* ]]; then
            echo "dist_tag=next" >> "$GITHUB_OUTPUT"
          else
            echo "dist_tag=latest" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish to npm with provenance
        run: npm publish --provenance --access public --tag ${{ steps.tag.outputs.dist_tag }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
