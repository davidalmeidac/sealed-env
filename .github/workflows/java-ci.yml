name: Java CI

on:
  push:
    branches: [main]
    paths:
      - "java/**"
      - "test-vectors/**"
      - "node/scripts/gen-test-vector.mjs"
      - ".github/workflows/java-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "java/**"
      - "test-vectors/**"
      - ".github/workflows/java-ci.yml"

permissions:
  contents: read

concurrency:
  group: java-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: ${{ matrix.os }} · JDK ${{ matrix.java }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        java: ["17", "21"]

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven

      - name: Set up Node 22 (for cross-stack vectors)
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22

      - name: Build Node side (regenerate test vectors)
        working-directory: node
        # Force bash on Windows runners — default is PowerShell, where
        # `mkdir -p` errors on an existing dir and shell semantics differ.
        shell: bash
        run: |
          npm ci
          npm run build
          mkdir -p ../test-vectors/v1
          node scripts/gen-test-vector.mjs basic      > ../test-vectors/v1/node-basic.json
          node scripts/gen-test-vector.mjs team       > ../test-vectors/v1/node-team.json
          node scripts/gen-test-vector.mjs enterprise > ../test-vectors/v1/node-enterprise.json

      - name: Build & test Java
        working-directory: java
        run: mvn -B -ntp verify

      - name: Upload surefire reports on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: surefire-${{ matrix.os }}-jdk${{ matrix.java }}
          path: java/**/target/surefire-reports/
          if-no-files-found: ignore

      # Java dependency security is covered by Dependabot, which already
      # alerted on bcprov-jdk18on (CVE-2026-5598, CVE-2026-0636) and
      # assertj-core (CVE-2026-24400) and is the canonical signal here.
      # Running OWASP dependency-check in CI would mean a 5-15 min step
      # downloading the full NVD feed each run — not worth the cost for
      # the marginal coverage over Dependabot. If we ever need
      # within-PR vulnerability gating, revisit and add the
      # `dependency-check-maven` plugin behind an opt-in profile.
