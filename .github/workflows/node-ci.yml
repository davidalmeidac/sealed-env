name: Node CI

on:
  push:
    branches: [main]
    paths:
      - 'node/**'
      - 'SPEC.md'
      - '.github/workflows/node-ci.yml'
  pull_request:
    paths:
      - 'node/**'
      - 'SPEC.md'
      - '.github/workflows/node-ci.yml'
  workflow_dispatch:

# Lock down the GITHUB_TOKEN to the minimum needed (CodeQL: "Workflow does
# not contain permissions"). CI is read-only — only checking out code and
# running tests. No write access required.
permissions:
  contents: read

defaults:
  run:
    working-directory: node

jobs:
  test:
    name: Test on Node ${{ matrix.node }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Lint workflow pinning
        working-directory: ${{ github.workspace }}
        run: node node/scripts/lint-workflows.mjs

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: node/package-lock.json

      - name: Install
        run: npm ci || npm install

      - name: Typecheck (lint)
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      # Run on a single matrix cell — npm audit reads the public registry,
      # the result is identical across OSes/Node versions, and we don't
      # need to spam it 6×.
      - name: Audit dependencies (high+ only)
        if: matrix.os == 'ubuntu-latest' && matrix.node == 22
        run: npm audit --audit-level=high --omit=dev
