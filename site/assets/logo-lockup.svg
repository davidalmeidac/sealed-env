<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 240" width="760" height="240" role="img" aria-label="sealed-env logo lockup">
  <!--
    sealed-env · primary lockup v3.1
    Self-contained: includes a cream paper backdrop so the mark renders
    correctly on dark, light, or any-color page background.
  -->

  <defs>
    <filter id="paperGrainLk" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="1.8" numOctaves="2" seed="13"/>
      <feColorMatrix values="0 0 0 0 0.10
                              0 0 0 0 0.08
                              0 0 0 0 0.07
                              0 0 0 0.07 0"/>
      <feComposite in2="SourceGraphic" operator="in"/>
    </filter>

    <filter id="paperBg" x="0%" y="0%" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="21"/>
      <feColorMatrix values="0 0 0 0 0.06
                              0 0 0 0 0.04
                              0 0 0 0 0.02
                              0 0 0 0.05 0"/>
      <feComposite in2="SourceGraphic" operator="in"/>
    </filter>

    <filter id="waxNoiseLk" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" seed="5"/>
      <feColorMatrix values="0 0 0 0 0.30
                              0 0 0 0 0.05
                              0 0 0 0 0.04
                              0 0 0 0.16 0"/>
      <feComposite in2="SourceGraphic" operator="in"/>
    </filter>

    <path id="waxLk"
      d="M 100 28
         C 120 27, 139 34, 154 47
         C 170 60, 179 78, 181 98
         C 183 119, 176 139, 162 154
         C 148 169, 129 176, 109 176
         C 89 176, 70 169, 55 155
         C 41 140, 34 120, 36 100
         C 38 80, 48 61, 64 48
         C 76 38, 90 32, 100 28 Z"
      fill="none"/>

    <path id="creamLk"
      d="M 100 42
         C 116 42, 132 48, 144 60
         C 157 73, 163 89, 162 107
         C 161 125, 152 141, 137 152
         C 122 164, 104 168, 87 164
         C 70 161, 55 151, 46 136
         C 38 121, 37 104, 44 88
         C 51 73, 64 61, 80 55
         C 88 52, 95 43, 100 42 Z"
      fill="none"/>
  </defs>

  <!-- ── 0. Cream paper backdrop (whole canvas) — gives life on any bg ── -->
  <rect x="0" y="0" width="760" height="240" fill="#f1ebe0"/>
  <g filter="url(#paperBg)" opacity="0.6">
    <rect x="0" y="0" width="760" height="240" fill="#1a1612"/>
  </g>

  <!-- Subtle cream paper edge / vignette — very minimal -->
  <rect x="2" y="2" width="756" height="236" fill="none" stroke="#1a1612" stroke-width="0.5" opacity="0.05"/>

  <!-- ── SIGILLUM (left) ───────────────────────────────────────── -->
  <g transform="translate(0, 30)">
    <use href="#waxLk" fill="#A8201A"/>
    <g filter="url(#waxNoiseLk)" opacity="0.55">
      <use href="#waxLk" fill="#A8201A"/>
    </g>

    <g stroke="#7A1411" stroke-width="0.4" stroke-linecap="round" opacity="0.4" fill="none">
      <path d="M 48 76 q 4 3 6 8"/>
      <path d="M 158 90 q -3 4 -1 9"/>
      <path d="M 142 152 q -3 -1 -7 -1"/>
    </g>

    <!-- subtle drip -->
    <path d="M 98 174
             C 96 181, 96 187, 98 191
             C 100 195, 102 195, 104 191
             C 106 187, 106 181, 104 174 Z"
          fill="#A8201A" opacity="0.85"/>

    <use href="#creamLk" fill="#f1ebe0"/>
    <g filter="url(#paperGrainLk)" opacity="0.7">
      <use href="#creamLk" fill="#1a1612"/>
    </g>
    <use href="#creamLk" fill="none" stroke="#1a1612" stroke-width="0.6" opacity="0.45"/>

    <!-- olive sprigs -->
    <g fill="#1a1612" opacity="0.55">
      <ellipse cx="54" cy="100" rx="4" ry="1.7" transform="rotate(-15 54 100)"/>
      <ellipse cx="54" cy="106" rx="4" ry="1.7" transform="rotate(15 54 106)"/>
      <ellipse cx="146" cy="100" rx="4" ry="1.7" transform="rotate(15 146 100)"/>
      <ellipse cx="146" cy="106" rx="4" ry="1.7" transform="rotate(-15 146 106)"/>
    </g>

    <text x="100" y="120"
          font-family="'Cinzel', 'Trajan Pro', 'IM Fell English SC', serif"
          font-size="58"
          font-weight="700"
          fill="#1a1612"
          text-anchor="middle"
          letter-spacing="-2">SE</text>

    <circle cx="100" cy="138" r="1.4" fill="#A8201A"/>
  </g>

  <!-- ── WORDMARK (right) ──────────────────────────────────────── -->
  <text x="220" y="135"
        font-family="'Fraunces', 'Instrument Serif', Georgia, serif"
        font-size="76"
        font-weight="500"
        font-style="italic"
        fill="#1a1612"
        letter-spacing="-2">sealed</text>

  <rect x="408" y="108" width="22" height="6" fill="#A8201A"/>

  <text x="438" y="135"
        font-family="'Fraunces', 'Instrument Serif', Georgia, serif"
        font-size="76"
        font-weight="500"
        font-style="italic"
        fill="#1a1612"
        letter-spacing="-2">env</text>

  <text x="220" y="175"
        font-family="'JetBrains Mono', 'Courier New', monospace"
        font-size="11"
        fill="#1a1612"
        opacity="0.6"
        letter-spacing="2">CVSTOS · ARCANI · ENCRYPT AT REST · WIPE ON READ</text>
</svg>
