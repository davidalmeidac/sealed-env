<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" width="320" height="320" role="img" aria-label="sealed-env stacked masthead">
  <!--
    sealed-env · stacked masthead variant
    Reads like a small magazine masthead. The bar separates the two words
    and stands in for the hyphen.
  -->
  <text x="160" y="140"
        font-family="'Fraunces', 'Instrument Serif', Georgia, serif"
        font-size="92"
        font-weight="400"
        font-style="italic"
        fill="#1a1612"
        text-anchor="middle"
        letter-spacing="-2">sealed</text>

  <!-- the seal -->
  <rect x="100" y="160" width="120" height="6" fill="#c4471f"/>

  <text x="160" y="220"
        font-family="'Fraunces', 'Instrument Serif', Georgia, serif"
        font-size="44"
        font-weight="400"
        font-style="italic"
        fill="#1a1612"
        text-anchor="middle"
        letter-spacing="6">env</text>
</svg>
